
{% load static %}

<section class="auth-hero" aria-label="Sustainable fashion">

        class="auth-hero-image"
        src="{% static 'img/auth-hero.jpg' %}"
        alt="image"
    >

    <div class="auth-hero-content">
        <p class="auth-hero-kicker">
            A CLEANER WORLD<br>
            A BRIGHTER WARDROBE

            Share More.<br>
            <em>Waste Less.</em>

        <a class="auth-hero-link" href="{% url 'home' %}">
            Explore Tcc. &rarr;
        </a>
    </div>
