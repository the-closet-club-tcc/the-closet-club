<div id="location-modal" class="chat-modal" popover="auto" role="dialog"
     aria-modal="true" aria-labelledby="location-modal-title">
  <button type="button" class="chat-modal__backdrop"
          popovertarget="location-modal" popovertargetaction="hide"
          aria-label="Tutup form lokasi"></button>
  <div class="chat-modal__content">
    <button type="button" class="chat-modal__close"
            popovertarget="location-modal" popovertargetaction="hide"
            aria-label="Tutup form lokasi">×</button>
    <h2 id="location-modal-title">Kirim lokasi</h2>
    <form hx-get="{% url 'chat:places' active.id %}" hx-target="#place-results"
          hx-swap="innerHTML" hx-indicator="#place-loading" class="space-y-3">
      <div class="flex gap-2">
        <input name="q" required autocomplete="off"
               placeholder="Ketik nama tempat, mis. Fasilkom UI atau Stasiun Depok Baru"
               class="min-w-0 flex-1 rounded-xl border border-[#E8E0D0] bg-white px-3 py-2 text-sm">
        <button class="btn btn-primary">Cari</button>
      </div>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-gray-600">
        <span>Persempit:</span>
        <label><input type="radio" name="category" value="" checked> Semua</label>
        <label><input type="radio" name="category" value="stasiun"> Stasiun</label>
        <label><input type="radio" name="category" value="minimarket"> Minimarket</label>
        <label><input type="radio" name="category" value="halte"> Halte</label>
      </div>
    </form>
    <p id="place-loading" class="htmx-indicator mt-2 text-sm text-gray-500">Mencari...</p>
    <div id="place-results" class="mt-3 max-h-64 space-y-2 overflow-y-auto"></div>
  </div>
</div>
