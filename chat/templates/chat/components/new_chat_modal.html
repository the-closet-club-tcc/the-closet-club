<div id="new-chat-modal" class="chat-modal" popover="auto" role="dialog"
     aria-modal="true" aria-labelledby="new-chat-modal-title">
  <button type="button" class="chat-modal__backdrop"
          popovertarget="new-chat-modal" popovertargetaction="hide"
          aria-label="Tutup pesan baru"></button>
  <div class="chat-modal__content">
    <button type="button" class="chat-modal__close"
            popovertarget="new-chat-modal" popovertargetaction="hide"
            aria-label="Tutup pesan baru">×</button>
    <h2 id="new-chat-modal-title">Pesan baru</h2>
    <input type="search" name="q" autocomplete="off" placeholder="Cari username"
           hx-get="{% url 'chat:user_search' %}"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#user-results" hx-indicator="#user-loading"
           class="mt-1 w-full rounded-xl border border-[#E8E0D0] bg-white px-3 py-2 text-base md:text-sm">
    <p id="user-loading" class="htmx-indicator mt-2 text-sm text-gray-500">Mencari...</p>
    <div id="user-results" class="mt-3 max-h-72 space-y-2 overflow-y-auto"></div>
  </div>
</div>
