{% load l10n %}
{% for p in results %}
<form hx-post="{% url 'chat:send_location' conversation.id %}"
      hx-target="#messages" hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful){this.closest('details').removeAttribute('open')}"
      class="flex items-center justify-between gap-3 rounded-lg bg-white p-3 text-sm">
  <div class="min-w-0">
    <p class="truncate font-semibold">{{ p.name }}</p>
    <p class="truncate text-gray-500">{{ p.address }}</p>
  </div>
  <input type="hidden" name="name" value="{{ p.name }}">
  <input type="hidden" name="address" value="{{ p.address }}">
  <input type="hidden" name="lat" value="{{ p.lat|unlocalize }}">
  <input type="hidden" name="lon" value="{{ p.lon|unlocalize }}">
  <button class="shrink-0 rounded-lg bg-[#344536] px-3 py-1 text-white">Kirim</button>
</form>
{% empty %}
  {% if searched %}<p class="text-sm text-gray-500">Tempat tidak ditemukan</p>{% endif %}
{% endfor %}
